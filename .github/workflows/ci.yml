name: CI
on:
  push: { branches: [master] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  public-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, attestations: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - run: python -m scripts.public_attestation
        env: { GH_TOKEN: "${{ github.token }}" }
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.13" }
      - run: python -m pip install pre-commit==4.3.0 setuptools==80.9.0 ruff==0.17.0
      - run: ruff check scripts tests setup.py
      - run: ruff format --check scripts tests setup.py
      - run: python -m unittest discover -s tests -v
      - run: python -m pre_commit validate-manifest .pre-commit-hooks.yaml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kjanat/actionlint
          ref: 6e394c888293218fac952ba8a8681739b0c4c2c3
          path: .host
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: .host/go.mod, cache-dependency-path: .host/go.sum }
      - name: Build the actual host
        working-directory: .host
        run: go build -o ../.host-binary/actionlint.exe ./cmd/actionlint
      - name: Install hook and exercise Wasm and deletion behavior
        run: python -m scripts.integration --binary .host-binary/actionlint.exe
